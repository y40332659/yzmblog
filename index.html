<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dribbble - Show and Tell for Designers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0d0d0d;
            color: #fff;
            line-height: 1.6;
        }
        
        /* 导航栏 */
        .navbar {
            background-color: #111;
            padding: 16px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #222;
        }
        
        .navbar-left {
            display: flex;
            align-items: center;
            gap: 32px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #ea4c89;
            text-decoration: none;
        }
        
        .nav-links {
            display: flex;
            gap: 24px;
        }
        
        .nav-link {
            color: #999;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
            cursor: pointer;
        }
        
        .nav-link:hover,
        .nav-link.active {
            color: #fff;
        }
        
        .navbar-center {
            flex: 1;
            max-width: 500px;
            margin: 0 40px;
        }
        
        .search-box {
            width: 100%;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: border-color 0.2s;
        }
        
        .search-box:focus-within {
            border-color: #ea4c89;
        }
        
        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 14px;
            width: 100%;
        }
        
        .search-box input::placeholder {
            color: #666;
        }
        
        .search-icon {
            color: #666;
        }
        
        .navbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .user-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid #333;
            color: #fff;
        }
        
        .btn-outline:hover {
            border-color: #ea4c89;
            color: #ea4c89;
        }
        
        .btn-primary {
            background-color: #ea4c89;
            color: #fff;
        }
        
        .btn-primary:hover {
            background-color: #e8377a;
        }
        
        /* 分类标签栏 */
        .category-bar {
            background-color: #111;
            padding: 12px 40px;
            display: flex;
            gap: 16px;
            overflow-x: auto;
            border-bottom: 1px solid #222;
        }
        
        .category-tag {
            padding: 8px 16px;
            background-color: #1a1a1a;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: #999;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        
        .category-tag:hover {
            color: #fff;
            background-color: #222;
        }
        
        .category-tag.active {
            background-color: #ea4c89;
            color: #fff;
        }
        
        /* 瀑布流布局 */
        .masonry-grid {
            padding: 40px;
            columns: 4;
            column-gap: 24px;
        }
        
        @media (max-width: 1400px) {
            .masonry-grid {
                columns: 3;
            }
        }
        
        @media (max-width: 1024px) {
            .masonry-grid {
                columns: 2;
            }
        }
        
        @media (max-width: 640px) {
            .masonry-grid {
                columns: 1;
            }
        }
        
        /* 作品卡片 */
        .shot-card {
            break-inside: avoid;
            margin-bottom: 24px;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background-color: #1a1a1a;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .shot-card:hover {
            transform: translateY(-4px);
        }
        
        .shot-image {
            width: 100%;
            display: block;
        }
        
        .shot-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0) 100%);
            opacity: 0;
            transition: opacity 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
        }
        
        .shot-card:hover .shot-overlay {
            opacity: 1;
        }
        
        .shot-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }
        
        .shot-author {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        
        .author-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
        }
        
        .author-name {
            font-size: 13px;
            color: #ccc;
        }
        
        .shot-stats {
            display: flex;
            gap: 16px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #ccc;
        }
        
        .stat-icon {
            font-size: 16px;
        }
        
        .shot-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        
        .shot-tag {
            padding: 4px 10px;
            background-color: rgba(255,255,255,0.15);
            border-radius: 12px;
            font-size: 11px;
            color: #ccc;
        }
        
        /* 模态框通用样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            z-index: 2000;
            overflow-y: auto;
        }
        
        .modal-content {
            background-color: #1a1a1a;
            margin: 50px auto;
            padding: 40px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            position: relative;
        }
        
        .modal-close {
            position: absolute;
            top: 20px;
            right: 24px;
            font-size: 32px;
            color: #666;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .modal-close:hover {
            color: #fff;
        }
        
        .modal-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .modal-subtitle {
            color: #999;
            margin-bottom: 32px;
        }
        
        /* 表单样式 */
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #ccc;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background-color: #222;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #ea4c89;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #666;
        }
        
        /* 图片上传区域 */
        .upload-area {
            border: 2px dashed #333;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 24px;
        }
        
        .upload-area:hover {
            border-color: #ea4c89;
            background-color: rgba(234, 76, 137, 0.05);
        }
        
        .upload-area.has-image {
            padding: 0;
            border: none;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .upload-text {
            color: #999;
            font-size: 14px;
        }
        
        .upload-preview {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 12px;
            display: none;
        }
        
        .upload-preview.show {
            display: block;
        }
        
        /* 作品预览模态框 */
        .preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            z-index: 2000;
            overflow-y: auto;
        }
        
        .preview-content {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 40px;
        }
        
        @media (max-width: 1024px) {
            .preview-content {
                grid-template-columns: 1fr;
            }
        }
        
        .preview-image-container {
            background-color: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
        }
        
        .preview-info {
            color: #fff;
        }
        
        .preview-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .preview-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
        }
        
        .preview-author-info h2 {
            font-size: 18px;
            margin-bottom: 4px;
        }
        
        .preview-author-info span {
            color: #999;
            font-size: 14px;
        }
        
        .preview-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        
        .preview-description {
            color: #ccc;
            margin-bottom: 24px;
            line-height: 1.8;
        }
        
        .preview-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }
        
        .preview-tag {
            padding: 6px 14px;
            background-color: #333;
            border-radius: 16px;
            font-size: 13px;
            color: #ccc;
        }
        
        .preview-stats {
            display: flex;
            gap: 24px;
            padding: 20px 0;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            margin-bottom: 24px;
        }
        
        .preview-stat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            color: #ccc;
        }
        
        .preview-actions {
            display: flex;
            gap: 12px;
        }
        
        .action-btn {
            flex: 1;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .action-btn.like {
            background-color: #ea4c89;
            color: #fff;
        }
        
        .action-btn.like:hover {
            background-color: #e8377a;
        }
        
        .action-btn.like.active {
            background-color: #ff6b9d;
        }
        
        .action-btn.collect {
            background-color: #333;
            color: #fff;
        }
        
        .action-btn.collect:hover {
            background-color: #444;
        }
        
        .action-btn.collect.active {
            background-color: #ffd700;
            color: #000;
        }

        /* 星级评分 */
        .star-rating {
            color: #333;
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .star-rating:hover,
        .star-rating.active {
            color: #f39c12;
        }

        .star-rating.preview {
            color: #f39c12;
        }
        
        /* 评论区 */
        .preview-comments {
            margin-top: 24px;
        }
        
        .preview-comments h3 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #fff;
        }
        
        .comment-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .comment-item {
            padding: 16px;
            background-color: #1a1a1a;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        
        .comment-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        
        .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }
        
        .comment-author {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }
        
        .comment-rating {
            color: #f39c12;
            font-size: 12px;
            margin-left: auto;
        }
        
        .comment-text {
            font-size: 14px;
            color: #ccc;
            margin-left: 42px;
        }
        
        /* Toast 提示 */
        .toast {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ea4c89;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            z-index: 3000;
            display: none;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 100px 20px;
            color: #666;
        }
        
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #999;
        }
        
        .empty-state p {
            font-size: 14px;
        }
        
        /* 用户下拉菜单 */
        .user-menu {
            position: relative;
        }
        
        .user-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background-color: #1a1a1a;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            margin-top: 8px;
            min-width: 180px;
            display: none;
            z-index: 1001;
        }
        
        .user-dropdown.show {
            display: block;
        }
        
        .user-dropdown-item {
            padding: 12px 20px;
            color: #ccc;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .user-dropdown-item:hover {
            background-color: #222;
            color: #fff;
        }
        
        .user-dropdown-item.danger {
            color: #ff6b6b;
        }
        
        .user-dropdown-item.danger:hover {
            background-color: rgba(255, 107, 107, 0.1);
        }
        
        /* 标签输入 */
        .tags-input-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px;
            background-color: #222;
            border: 1px solid #333;
            border-radius: 8px;
        }
        
        .tag-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background-color: #ea4c89;
            border-radius: 16px;
            font-size: 13px;
        }
        
        .tag-chip span {
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }
        
        .tags-input-container input {
            flex: 1;
            min-width: 100px;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 14px;
        }
        
        /* 作品集标签页 */
        .portfolio-tabs {
            display: flex;
            gap: 8px;
            padding: 0 40px;
            margin-top: 20px;
        }
        
        .portfolio-tab {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            color: #999;
            transition: all 0.2s;
        }
        
        .portfolio-tab:hover {
            color: #fff;
        }
        
        .portfolio-tab.active {
            background-color: #ea4c89;
            color: #fff;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-left">
            <a href="#" class="logo" onclick="showMainPage()">Dribbb</a>
            <div class="nav-links">
                <a class="nav-link active" onclick="showMainPage()">热门作品</a>
                <a class="nav-link" onclick="showMyWorks()">我的作品</a>
            </div>
        </div>
        
        <div class="navbar-center">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索作品..." onkeyup="handleSearch(event)">
            </div>
        </div>
        
        <div class="navbar-right" id="navbarRight">
            <button class="btn btn-outline" onclick="openLoginModal()">登录</button>
            <button class="btn btn-primary" onclick="openRegisterModal()">注册</button>
        </div>
    </nav>
    
    <!-- 分类标签栏 -->
    <div class="category-bar" id="categoryBar">
        <div class="category-tag active" onclick="filterByCategory('all')">全部作品</div>
        <div class="category-tag" onclick="filterByCategory('web')">网页设计</div>
        <div class="category-tag" onclick="filterByCategory('mobile')">移动应用</div>
        <div class="category-tag" onclick="filterByCategory('branding')">品牌设计</div>
        <div class="category-tag" onclick="filterByCategory('illustration')">插画设计</div>
        <div class="category-tag" onclick="filterByCategory('animation')">动画设计</div>
        <div class="category-tag" onclick="filterByCategory('product')">产品设计</div>
        <div class="category-tag" onclick="filterByCategory('typography')">字体设计</div>
    </div>
    
    <!-- 作品集标签页 -->
    <div class="portfolio-tabs" id="portfolioTabs" style="display: none;">
        <div class="portfolio-tab active" onclick="showMainPage()">全部作品</div>
        <div class="portfolio-tab" onclick="showMyWorks()">我的作品</div>
    </div>
    
    <!-- 作品瀑布流 -->
    <div class="masonry-grid" id="shotsGrid">
    </div>
    
    <!-- 注册模态框 -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('registerModal')">&times;</span>
            <h1 class="modal-title">创建账号</h1>
            <p class="modal-subtitle">加入我们，分享你的创意设计</p>
            
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="registerUsername" placeholder="请输入用户名" required>
                </div>
                
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="registerEmail" placeholder="请输入邮箱" required>
                </div>
                
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="registerPassword" placeholder="请输入密码" required minlength="6">
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">注册</button>
            </form>
            
            <p style="text-align: center; margin-top: 24px; color: #999; font-size: 14px;">
                已有账号？<a href="#" style="color: #ea4c89; text-decoration: none;" onclick="closeModal('registerModal'); openLoginModal()">立即登录</a>
            </p>
        </div>
    </div>
    
    <!-- 登录模态框 -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('loginModal')">&times;</span>
            <h1 class="modal-title">欢迎回来</h1>
            <p class="modal-subtitle">登录以继续浏览和分享作品</p>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="loginEmail" placeholder="请输入邮箱" required>
                </div>
                
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">登录</button>
            </form>
            
            <p style="text-align: center; margin-top: 24px; color: #999; font-size: 14px;">
                没有账号？<a href="#" style="color: #ea4c89; text-decoration: none;" onclick="closeModal('loginModal'); openRegisterModal()">立即注册</a>
            </p>
        </div>
    </div>

        // 格式化数字
        function formatNumber(num) {
            if (num === undefined || num === null || isNaN(num)) {
                return '0';
            }
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }
        
        // 获取名字首字母
        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').toUpperCase();
        }
        
        // 格式化时间
        function formatTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            
            const minutes = Math.floor(diff / (1000 * 60));
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            if (minutes < 60) return `${minutes}分钟前`;
            if (hours < 24) return `${hours}小时前`;
            if (days < 7) return `${days}天前`;
            return `${Math.floor(days / 7)}周前`;
        }

        // 使用 Imgur API 上传图片（支持大图）
        async function uploadToImgur(file) {
            const CLIENT_ID = 'YOUR_IMGUR_CLIENT_ID'; // 需要替换为实际的 Client ID
            
            // 如果没有配置 Imgur，回退到本地存储
            if (!CLIENT_ID || CLIENT_ID === 'YOUR_IMGUR_CLIENT_ID') {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        resolve(e.target.result);
                    };
                    reader.readAsDataURL(file);
                });
            }
            
            try {
                const formData = new FormData();
                formData.append('image', file);
                
                const response = await fetch('https://api.imgur.com/3/image', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Client-ID ${CLIENT_ID}`
                    },
                    body: formData
                });
                
                const data = await response.json();
                if (data.success) {
                    return data.data.link;
                } else {
                    throw new Error(data.data.error);
                }
            } catch (error) {
                console.error('Imgur 上传失败，使用本地存储:', error);
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        resolve(e.target.result);
                    };
                    reader.readAsDataURL(file);
                });
            }
        }

                    document.getElementById('uploadPlaceholder').style.display = 'none';

            if (e.key === 'Enter' && e.target.value.trim()) {
                e.preventDefault();

                if (!selectedTags.includes(tag) && selectedTags.length < 10) {
                    selectedTags.push(tag);
                    renderTags();
                }
                e.target.value = '';
            }

        function removeTag(tag) {
            selectedTags = selectedTags.filter(t => t !== tag);
            renderTags();

            const tagInput = document.getElementById('tagInput');
            container.innerHTML = '';
            
            selectedTags.forEach(tag => {

                tagChip.innerHTML = `

            const description = document.getElementById('uploadDescription').value.trim();
            const category = document.getElementById('uploadCategory').value;
            
            if (!category) {
                showToast('请选择分类');
                return;
            }
            
            try {
                const token = getToken();
                const response = await api.createShot({
                    title,
                    description,
                    image: uploadedImageData,
                    category,
                    tags: [...selectedTags]
                }, token);
                
                if (response.message === '作品创建成功') {
                    closeModal('uploadModal');
                    resetUploadForm();
                    showToast('作品发布成功！');
                    await loadShotsFromAPI();
                } else {

        // 渲染作品列表
        function renderShots() {
            const grid = document.getElementById('shotsGrid');
            let shots = getShots();
            
            if (showMyWorksOnly && currentUser) {
                shots = shots.filter(shot => shot.authorId === currentUser.id);
                
                if (shots.length === 0) {
                    grid.innerHTML = `

                            <div class="empty-state-icon">📁</div>
                            <h3>你还没有上传作品</h3>

                            <button class="btn btn-primary" onclick="openUploadModal()" style="margin-top: 20px;">上传作品</button>
                        </div>
                    `;
                    return;
                }
            } else {
                if (currentCategory !== 'all') {
                    shots = shots.filter(shot => shot.category === currentCategory);
                }
            }
            
            if (shots.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="column-span: all;">
                        <div class="empty-state-icon">🎨</div>
                        <h3>暂无作品</h3>
                        <p>看看其他分类或稍后再来</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = shots.map(shot => {
                const shotId = shot.id || shot._id;
                const aspectRatio = Math.random() > 0.5 ? '4/3' : '3/4';
                const tags = shot.tags || [];
                return `
                    <div class="shot-card" onclick="openPreview('${shotId}')">
                        <img class="shot-image" src="${shot.image}" alt="${shot.title}" style="aspect-ratio: ${aspectRatio}; object-fit: cover;">

                            <h3 class="shot-title">${shot.title}</h3>
                            <div class="shot-author">
                                <div class="author-avatar">${getInitials(shot.author)}</div>
                                <span class="author-name">${shot.author}</span>
                            </div>
                            <div class="shot-stats">
                                <div class="stat-item">
                                    <span class="stat-icon">❤️</span>
                                    <span>${formatNumber(shot.likes)}</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-icon">👁️</span>
                                    <span>${formatNumber(shot.views)}</span>
                                </div>
                            </div>
                            <div class="shot-tags">
                                ${tags.slice(0, 3).map(tag => `<span class="shot-tag">${tag}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // 分类筛选
        function filterByCategory(category) {
            currentCategory = category;
            
            document.querySelectorAll('.category-tag').forEach(tag => {
                tag.classList.remove('active');
                if (category === 'all' && tag.textContent.includes('全部')) {
                    tag.classList.add('active');
                } else if (tag.textContent.toLowerCase().includes(category)) {
                    tag.classList.add('active');
                }
            });
            
            renderShots();
        }
        
        // 搜索功能
        function handleSearch(event) {
            if (event.key === 'Enter') {
                const query = event.target.value.toLowerCase();
                const shots = getShots();
                
                if (query === '') {
                    currentCategory = 'all';
                    renderShots();
                    return;
                }
                
                const filteredShots = shots.filter(shot => 
                    shot.title.toLowerCase().includes(query) ||
                    shot.author.toLowerCase().includes(query) ||
                    shot.tags.some(tag => tag.toLowerCase().includes(query)) ||
                    shot.description.toLowerCase().includes(query)
                );
                
                const grid = document.getElementById('shotsGrid');
                
                if (filteredShots.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state" style="column-span: all;">
                            <div class="empty-state-icon">🔍</div>
                            <h3>没有找到相关作品</h3>
                            <p>试试其他关键词</p>
                        </div>
                    `;
                    return;
                }
                
                grid.innerHTML = filteredShots.map(shot => {
                    const shotId = shot.id || shot._id;
                    const aspectRatio = Math.random() > 0.5 ? '4/3' : '3/4';
                    return `
                        <div class="shot-card" onclick="openPreview('${shotId}')">
                            <img class="shot-image" src="${shot.image}" alt="${shot.title}" style="aspect-ratio: ${aspectRatio}; object-fit: cover;">
                            <div class="shot-overlay">
                                <h3 class="shot-title">${shot.title}</h3>
                                <div class="shot-author">
                                    <div class="author-avatar">${getInitials(shot.author)}</div>
                                    <span class="author-name">${shot.author}</span>
                                </div>
                                <div class="shot-stats">
                                    <div class="stat-item">
                                        <span class="stat-icon">❤️</span>
                                        <span>${formatNumber(shot.likes)}</span>
                                    </div>
                                    <div class="stat-item">
                                        <span class="stat-icon">👁️</span>
                                        <span>${formatNumber(shot.views)}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }
        
        // 打开预览
        function openPreview(shotId) {
            const shots = getShots();
            const shot = shots.find(s => s.id === shotId || s._id === shotId);
            if (!shot) return;
            
            shot.views = (shot.views || 0) + 1;
            saveShots(shots);
            
            currentShot = shot;
            
            document.getElementById('previewImage').src = shot.image;
            document.getElementById('previewAvatar').textContent = getInitials(shot.author);
            document.getElementById('previewAuthorName').textContent = shot.author;
            document.getElementById('previewTime').textContent = formatTime(shot.createdAt);
            document.getElementById('previewTitle').textContent = shot.title;
            document.getElementById('previewDescription').textContent = shot.description || '';
            document.getElementById('previewTags').innerHTML = (shot.tags || []).map(tag => `<span class="preview-tag">${tag}</span>`).join('');
            document.getElementById('previewLikes').textContent = formatNumber(shot.likes);
            document.getElementById('previewViews').textContent = formatNumber(shot.views);
            document.getElementById('previewCollects').textContent = formatNumber(shot.collects || 0);
            document.getElementById('commentCount').textContent = (shot.comments || []).length;
            
            updateActionButtons();
            renderComments();
            
            document.getElementById('previewModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }
        
        function closePreview() {
            document.getElementById('previewModal').style.display = 'none';
            document.body.style.overflow = 'auto';
            currentShot = null;
        }
        
        function updateActionButtons() {
            if (!currentShot) return;
            
            const likeBtn = document.getElementById('likeBtn');
            const collectBtn = document.getElementById('collectBtn');
            
            if (currentShot.liked) {
                likeBtn.classList.add('active');
                likeBtn.innerHTML = '<span>❤️</span> 已点赞';
            } else {
                likeBtn.classList.remove('active');
                likeBtn.innerHTML = '<span>❤️</span> 点赞';
            }
            
            if (currentShot.collected) {
                collectBtn.classList.add('active');
                collectBtn.innerHTML = '<span>💾</span> 已收藏';
            } else {
                collectBtn.classList.remove('active');
                collectBtn.innerHTML = '<span>💾</span> 收藏';
            }
        }
        
        function toggleLike() {
            if (!currentShot) return;
            
            const shots = getShots();
            const shot = shots.find(s => s.id === currentShot.id);
            if (!shot) return;
            
            shot.liked = !shot.liked;
            shot.likes += shot.liked ? 1 : -1;
            currentShot = shot;
            
            saveShots(shots);
            updateActionButtons();
            document.getElementById('previewLikes').textContent = formatNumber(shot.likes);
            
            showToast(shot.liked ? '已点赞！' : '取消点赞');
            renderShots();
        }
        
        function toggleCollect() {
            if (!currentShot) return;
            
            const shots = getShots();
            const shot = shots.find(s => s.id === currentShot.id);
            if (!shot) return;
            
            shot.collected = !shot.collected;
            shot.collects += shot.collected ? 1 : -1;
            currentShot = shot;
            
            saveShots(shots);
            updateActionButtons();
            document.getElementById('previewCollects').textContent = formatNumber(shot.collects);
            
            showToast(shot.collected ? '已收藏！' : '取消收藏');
            renderShots();
        }
        
        function renderComments() {
            if (!currentShot) return;
            
            const commentList = document.getElementById('commentList');
            
            if (currentShot.comments.length === 0) {
                commentList.innerHTML = '<p style="color: #666; text-align: center; padding: 20px;">暂无评论</p>';
                return;
            }
            
            commentList.innerHTML = currentShot.comments.map(comment => {
                const stars = '★'.repeat(comment.rating || 4) + '☆'.repeat(5 - (comment.rating || 4));
                return `
                    <div class="comment-item">
                        <div class="comment-header">
                            <div class="comment-avatar">${getInitials(comment.author)}</div>
                            <span class="comment-author">${comment.author}</span>
                            <span class="comment-rating">${stars}</span>
                        </div>
                        <p class="comment-text">${comment.text}</p>
                    </div>
                `;
            }).join('');
        }

        function setRating(rating) {
            selectedRating = rating;
            updateStarDisplay();
            document.getElementById('ratingText').textContent = rating + '分';
        }

        function previewRating(rating) {
            const stars = document.querySelectorAll('.star-rating');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('preview');
                    star.style.color = '#f39c12';
                } else {
                    star.classList.remove('preview');
                    star.style.color = '#333';
                }
            });
            document.getElementById('ratingText').textContent = rating + '分';
        }

        function resetRating() {
            updateStarDisplay();
            document.getElementById('ratingText').textContent = selectedRating + '分';
        }

        function updateStarDisplay() {
            const stars = document.querySelectorAll('.star-rating');
            stars.forEach((star, index) => {
                if (index < selectedRating) {
                    star.style.color = '#f39c12';
                } else {
                    star.style.color = '#333';
                }
            });
        }

        function addComment() {
            if (!currentShot) return;
            
            const input = document.getElementById('detailCommentInput');
            const text = input.value.trim();
            
            if (!text) {
                showToast('请输入评论内容');
                return;
            }
            
            const shots = getShots();
            const shot = shots.find(s => s.id === currentShot.id);
            if (!shot) return;
            
            const commentData = {
                author: currentUser ? currentUser.username : '匿名用户',
                authorId: currentUser ? currentUser.id : null,
                text,
                rating: selectedRating
            };
            
            shot.comments.push(commentData);
            currentShot = shot;
            saveShots(shots);
            
            input.value = '';
            document.getElementById('commentCount').textContent = shot.comments.length;
            renderComments();
            renderShots();
            
            showToast('评论发布成功！');
        }
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
        
        // API 服务层
        const API_BASE = '/api';
        
        const api = {
            register: async (userData) => {
                const response = await fetch(`${API_BASE}/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'register', ...userData })
                });
                return response.json();
            },
            
            login: async (credentials) => {
                const response = await fetch(`${API_BASE}/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'login', ...credentials })
                });
                return response.json();
            },
            
            getAllShots: async () => {
                const response = await fetch(`${API_BASE}/shots`);
                return response.json();
            },
            
            getShot: async (shotId) => {
                const response = await fetch(`${API_BASE}/shots?id=${shotId}`);
                return response.json();
            },
            
            createShot: async (shotData, token) => {
                const response = await fetch(`${API_BASE}/shots`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(shotData)
                });
                return response.json();
            },
            
            likeShot: async (shotId, token) => {
                const response = await fetch(`${API_BASE}/shots?id=${shotId}`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ action: 'like' })
                });
                return response.json();
            },
            
            addComment: async (shotId, commentData, token) => {
                const response = await fetch(`${API_BASE}/shots?id=${shotId}`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ action: 'comment', ...commentData })
                });
                return response.json();
            },
            
            getUserShots: async (userId) => {
                const response = await fetch(`${API_BASE}/shots?userId=${userId}`);
                return response.json();
            }
        };
        
        function setToken(token) {
            localStorage.setItem('token', token);
        }
        
        function getToken() {
            return localStorage.getItem('token');
        }
        
        function removeToken() {
            localStorage.removeItem('token');
        }
        
        // 从 API 加载作品
        async function loadShotsFromAPI() {
            try {
                const response = await api.getAllShots();
                if (Array.isArray(response)) {
                    saveShots(response);
                    renderShots();
                }
            } catch (error) {
                console.error('加载作品失败:', error);
            }
        }
        
        // 页面初始化
        async function initializeApp() {
            initializeData();
            initializeUser();
            await loadShotsFromAPI();
        }
        
        initializeApp();
    </script>
</body>
</html>
