<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 作品点评平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0d0d0d;
            color: #fff;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        /* 登录页面样式 */
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background-color: #1a1a1a;
            padding: 48px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        
        .login-logo {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .login-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .login-subtitle {
            color: #999;
            margin-bottom: 32px;
        }
        
        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #ccc;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background-color: #222;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #ea4c89;
        }
        
        .form-group input::placeholder {
            color: #666;
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            width: 100%;
        }
        
        .btn-primary {
            background-color: #ea4c89;
            color: #fff;
            padding: 14px;
        }
        
        .btn-primary:hover {
            background-color: #e8377a;
        }
        
        .error-message {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .back-link {
            margin-top: 24px;
            color: #999;
            font-size: 14px;
        }
        
        .back-link a {
            color: #ea4c89;
            text-decoration: none;
        }
        
        /* 后台管理面板样式 */
        .admin-panel {
            display: none;
            min-height: 100vh;
        }
        
        .admin-panel.active {
            display: block;
        }
        
        .admin-header {
            background-color: #1a1a1a;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        
        .admin-title {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
        }
        
        .admin-nav {
            display: flex;
            gap: 20px;
        }
        
        .admin-nav-item {
            padding: 10px 20px;
            background-color: #222;
            border-radius: 8px;
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .admin-nav-item:hover,
        .admin-nav-item.active {
            background-color: #ea4c89;
            color: #fff;
        }
        
        .admin-content {
            padding: 40px;
        }
        
        .admin-section {
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }
        
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #ea4c89;
            margin-bottom: 8px;
        }
        
        .stat-label {
            font-size: 14px;
            color: #999;
        }
        
        /* 表格样式 */
        .admin-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .admin-table th,
        .admin-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        
        .admin-table th {
            background-color: #222;
            font-weight: 600;
            color: #ccc;
        }
        
        .admin-table tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        
        .admin-avatar-small {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
        }
        
        .action-btn {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            margin-right: 8px;
            transition: all 0.2s;
        }
        
        .action-btn.edit {
            background-color: #3b82f6;
            color: #fff;
        }
        
        .action-btn.edit:hover {
            background-color: #2563eb;
        }
        
        .action-btn.delete {
            background-color: #ef4444;
            color: #fff;
        }
        
        .action-btn.delete:hover {
            background-color: #dc2626;
        }
        
        .action-btn.view {
            background-color: #22c55e;
            color: #fff;
        }
        
        .action-btn.view:hover {
            background-color: #16a34a;
        }
        
        /* 用户资料模态框 */
        .user-profile-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            z-index: 2000;
            overflow-y: auto;
        }
        
        .user-profile-content {
            background-color: #1a1a1a;
            margin: 50px auto;
            padding: 40px;
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
        }
        
        .modal-close {
            position: absolute;
            top: 20px;
            right: 24px;
            font-size: 32px;
            color: #666;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .modal-close:hover {
            color: #fff;
        }
        
        .profile-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 700;
            color: #fff;
            margin: 0 auto 20px;
        }
        
        .profile-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .profile-email {
            color: #999;
            font-size: 14px;
        }
        
        .profile-info {
            margin-bottom: 24px;
        }
        
        .info-row {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #333;
        }
        
        .info-label {
            width: 120px;
            color: #999;
            font-size: 14px;
        }
        
        .info-value {
            flex: 1;
            color: #fff;
            font-size: 14px;
        }
        
        .user-works-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .user-work-item {
            display: flex;
            gap: 16px;
            padding: 16px;
            background-color: #222;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        
        .user-work-image {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
        }
        
        .user-work-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .user-work-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .user-work-stats {
            font-size: 12px;
            color: #999;
        }
        
        /* Toast 提示 */
        .toast {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ea4c89;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            z-index: 3000;
            display: none;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        @media (max-width: 768px) {
            .admin-stats {
                grid-template-columns: 1fr;
            }
            
            .admin-header {
                flex-direction: column;
                gap: 20px;
            }
            
            .admin-nav {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .admin-table {
                font-size: 12px;
            }
            
            .admin-table th,
            .admin-table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <!-- 登录页面 -->
    <div id="loginPage" class="login-page">
        <div class="login-container">
            <div class="login-logo">🔧</div>
            <h1 class="login-title">后台管理</h1>
            <p class="login-subtitle">请输入管理员账号和密码</p>
            
            <div id="errorMessage" class="error-message"></div>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="adminUsername" placeholder="admin" required>
                </div>
                
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="adminPassword" placeholder="admin123" required>
                </div>
                
                <button type="submit" class="btn btn-primary">登录</button>
            </form>
            
            <div class="back-link">
                <a href="index.html">← 返回首页</a>
            </div>
        </div>
    </div>
    
    <!-- 后台管理面板 -->
    <div id="adminPanel" class="admin-panel">
        <div class="admin-header">
            <div class="admin-title">🔧 后台管理</div>
            <div class="admin-nav">
                <div class="admin-nav-item active" onclick="showSection('dashboard')">数据概览</div>
                <div class="admin-nav-item" onclick="showSection('users')">用户管理</div>
                <div class="admin-nav-item" onclick="showSection('works')">作品管理</div>
                <div class="admin-nav-item" onclick="handleLogout()">退出登录</div>
            </div>
        </div>
        
        <div class="admin-content">
            <!-- 数据概览 -->
            <div id="section-dashboard">
                <div class="admin-stats">
                    <div class="stat-card">
                        <div class="stat-value" id="statUsers">0</div>
                        <div class="stat-label">注册用户</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statWorks">0</div>
                        <div class="stat-label">作品总数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statComments">0</div>
                        <div class="stat-label">评论总数</div>
                    </div>
                </div>
                
                <div class="admin-section">
                    <h3 class="section-title">最新用户</h3>
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>头像</th>
                                <th>用户名</th>
                                <th>邮箱</th>
                                <th>注册时间</th>
                                <th>作品数</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="recentUsersTable">
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- 用户管理 -->
            <div id="section-users" style="display: none;">
                <div class="admin-section">
                    <div class="section-header">
                        <h3 class="section-title">用户列表</h3>
                        <input type="text" id="userSearchInput" placeholder="搜索用户名或邮箱..." onkeyup="searchUsers()" style="padding: 10px 16px; background-color: #222; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; outline: none;" onfocus="this.style.borderColor='#ea4c89'" onblur="this.style.borderColor='#333'">
                    </div>
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>头像</th>
                                <th>用户名</th>
                                <th>邮箱</th>
                                <th>注册时间</th>
                                <th>作品数</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable">
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- 作品管理 -->
            <div id="section-works" style="display: none;">
                <div class="admin-section">
                    <div class="section-header">
                        <h3 class="section-title">作品列表</h3>
                        <input type="text" id="workSearchInput" placeholder="搜索作品标题..." onkeyup="searchWorks()" style="padding: 10px 16px; background-color: #222; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; outline: none;" onfocus="this.style.borderColor='#ea4c89'" onblur="this.style.borderColor='#333'">
                    </div>
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>预览图</th>
                                <th>标题</th>
                                <th>作者</th>
                                <th>分类</th>
                                <th>点赞/浏览</th>
                                <th>评论数</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="worksTable">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 用户资料模态框 -->
    <div id="userProfileModal" class="user-profile-modal">
        <div class="user-profile-content" style="position: relative;">
            <span class="modal-close" onclick="closeModal('userProfileModal')">&times;</span>
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar"></div>
                <div class="profile-name" id="profileName"></div>
                <div class="profile-email" id="profileEmail"></div>
            </div>
            
            <div class="profile-info">
                <div class="info-row">
                    <div class="info-label">用户ID</div>
                    <div class="info-value" id="profileId"></div>
                </div>
                <div class="info-row">
                    <div class="info-label">注册时间</div>
                    <div class="info-value" id="profileCreated"></div>
                </div>
                <div class="info-row">
                    <div class="info-label">作品数量</div>
                    <div class="info-value" id="profileWorksCount"></div>
                </div>
            </div>
            
            <h3 class="section-title" style="margin-bottom: 16px;">用户作品</h3>
            <div class="user-works-list" id="userWorksList"></div>
        </div>
    </div>
    
    <!-- Toast 提示 -->
    <div id="toast" class="toast"></div>
    
    <script>
        // 数据操作函数（从 localStorage 读取，与 index.html 共用）
        function getUsers() {
            return JSON.parse(localStorage.getItem('users') || '[]');
        }
        
        function getShots() {
            return JSON.parse(localStorage.getItem('shots') || '[]');
        }
        
        function saveUsers(users) {
            localStorage.setItem('users', JSON.stringify(users));
        }
        
        function saveShots(shots) {
            localStorage.setItem('shots', JSON.stringify(shots));
        }
        
        // 获取名字首字母
        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').toUpperCase();
        }
        
        // 格式化时间
        function formatTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            
            const minutes = Math.floor(diff / (1000 * 60));
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            if (minutes < 60) return `${minutes}分钟前`;
            if (hours < 24) return `${hours}小时前`;
            if (days < 7) return `${days}天前`;
            return date.toLocaleDateString();
        }
        
        // 获取分类名称
        function getCategoryName(category) {
            const categories = {
                'web': '网页设计',
                'mobile': '移动应用',
                'branding': '品牌设计',
                'illustration': '插画设计',
                'animation': '动画设计',
                'product': '产品设计',
                'typography': '字体设计'
            };
            return categories[category] || category;
        }
        
        // 登录处理
        function handleLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value;
            
            if (username === 'admin' && password === 'admin123') {
                localStorage.setItem('adminLoggedIn', 'true');
                showAdminPanel();
                showToast('登录成功！');
            } else {
                showError('用户名或密码错误！');
            }
        }
        
        // 显示错误信息
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 3000);
        }
        
        // 显示后台管理面板
        function showAdminPanel() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminPanel').classList.add('active');
            
            renderDashboard();
            renderUsersTable();
            renderWorksTable();
        }
        
        // 显示指定区域
        function showSection(section) {
            document.querySelectorAll('.admin-nav-item').forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('section-dashboard').style.display = 'none';
            document.getElementById('section-users').style.display = 'none';
            document.getElementById('section-works').style.display = 'none';
            
            document.getElementById(`section-${section}`).style.display = 'block';
        }
        
        // 渲染数据概览
        function renderDashboard() {
            const users = getUsers();
            const shots = getShots();
            
            let totalComments = 0;
            shots.forEach(shot => {
                totalComments += shot.comments.length;
            });
            
            document.getElementById('statUsers').textContent = users.length;
            document.getElementById('statWorks').textContent = shots.length;
            document.getElementById('statComments').textContent = totalComments;
            
            const recentUsers = [...users].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 5);
            renderUsersTableData(recentUsers, 'recentUsersTable');
        }
        
        // 渲染用户表格
        function renderUsersTable() {
            const users = getUsers();
            renderUsersTableData(users, 'usersTable');
        }
        
        function renderUsersTableData(users, tableId) {
            const tbody = document.getElementById(tableId);
            
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #999;">暂无用户</td></tr>';
                return;
            }
            
            tbody.innerHTML = users.map(user => {
                const userWorks = getShots().filter(shot => shot.authorId === user.id);
                return `
                    <tr>
                        <td><div class="admin-avatar-small">${getInitials(user.username)}</div></td>
                        <td>${user.username}</td>
                        <td>${user.email}</td>
                        <td>${formatTime(user.createdAt)}</td>
                        <td>${userWorks.length}</td>
                        <td>
                            <button class="action-btn view" onclick="viewUserProfile(${user.id})">查看</button>
                            <button class="action-btn delete" onclick="deleteUser(${user.id})">删除</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        // 搜索用户
        function searchUsers() {
            const query = document.getElementById('userSearchInput').value.toLowerCase();
            const users = getUsers();
            
            const filteredUsers = users.filter(user => 
                user.username.toLowerCase().includes(query) ||
                user.email.toLowerCase().includes(query)
            );
            
            renderUsersTableData(filteredUsers, 'usersTable');
        }
        
        // 查看用户资料
        function viewUserProfile(userId) {
            const user = getUsers().find(u => u.id === userId);
            if (!user) return;
            
            const userWorks = getShots().filter(shot => shot.authorId === userId);
            
            document.getElementById('profileAvatar').textContent = getInitials(user.username);
            document.getElementById('profileName').textContent = user.username;
            document.getElementById('profileEmail').textContent = user.email;
            document.getElementById('profileId').textContent = user.id;
            document.getElementById('profileCreated').textContent = new Date(user.createdAt).toLocaleString();
            document.getElementById('profileWorksCount').textContent = userWorks.length;
            
            const worksList = document.getElementById('userWorksList');
            if (userWorks.length === 0) {
                worksList.innerHTML = '<p style="color: #666; text-align: center; padding: 20px;">该用户暂无作品</p>';
            } else {
                worksList.innerHTML = userWorks.map(work => `
                    <div class="user-work-item">
                        <img class="user-work-image" src="${work.image}" alt="${work.title}">
                        <div class="user-work-info">
                            <div class="user-work-title">${work.title}</div>
                            <div class="user-work-stats">❤️ ${work.likes} | 👁️ ${work.views} | 💬 ${work.comments.length}</div>
                        </div>
                    </div>
                `).join('');
            }
            
            document.getElementById('userProfileModal').style.display = 'block';
        }
        
        // 删除用户
        function deleteUser(userId) {
            if (!confirm('确定要删除该用户吗？此操作不可撤销！')) return;
            
            let users = getUsers();
            users = users.filter(u => u.id !== userId);
            saveUsers(users);
            
            let shots = getShots();
            shots = shots.filter(s => s.authorId !== userId);
            saveShots(shots);
            
            showToast('用户删除成功！');
            renderDashboard();
            renderUsersTable();
        }
        
        // 渲染作品表格
        function renderWorksTable() {
            const shots = getShots();
            renderWorksTableData(shots, 'worksTable');
        }
        
        function renderWorksTableData(shots, tableId) {
            const tbody = document.getElementById(tableId);
            
            if (shots.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: #999;">暂无作品</td></tr>';
                return;
            }
            
            tbody.innerHTML = shots.map(shot => {
                return `
                    <tr>
                        <td><img src="${shot.image}" alt="${shot.title}" style="width: 60px; height: 60px; border-radius: 8px; object-fit: cover;"></td>
                        <td>${shot.title}</td>
                        <td>${shot.author}</td>
                        <td>${getCategoryName(shot.category)}</td>
                        <td>${shot.likes} / ${shot.views}</td>
                        <td>${shot.comments.length}</td>
                        <td>${formatTime(shot.createdAt)}</td>
                        <td>
                            <button class="action-btn delete" onclick="deleteWork(${shot.id})">删除</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        // 搜索作品
        function searchWorks() {
            const query = document.getElementById('workSearchInput').value.toLowerCase();
            const shots = getShots();
            
            const filteredShots = shots.filter(shot => 
                shot.title.toLowerCase().includes(query) ||
                shot.author.toLowerCase().includes(query)
            );
            
            renderWorksTableData(filteredShots, 'worksTable');
        }
        
        // 删除作品
        function deleteWork(workId) {
            if (!confirm('确定要删除该作品吗？此操作不可撤销！')) return;
            
            let shots = getShots();
            shots = shots.filter(s => s.id !== workId);
            saveShots(shots);
            
            showToast('作品删除成功！');
            renderDashboard();
            renderWorksTable();
        }
        
        // 关闭模态框
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
        
        // 退出登录
        function handleLogout() {
            localStorage.removeItem('adminLoggedIn');
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('adminUsername').value = '';
            document.getElementById('adminPassword').value = '';
            showToast('已退出登录');
        }
        
        // 显示 Toast 提示
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
        
        // 页面加载时检查登录状态
        window.addEventListener('load', function() {
            const isLoggedIn = localStorage.getItem('adminLoggedIn') === 'true';
            if (isLoggedIn) {
                showAdminPanel();
            }
        });
    </script>
</body>
</html>
